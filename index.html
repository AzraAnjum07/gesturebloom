<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GestureBloom</title>
  <meta name="description" content="Grow a bouquet in the air with your hands. Runs in your browser, nothing to install.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Landing screen: browsers only allow camera access after a user click -->
  <div id="landing">
    <div class="petals" aria-hidden="true">
      <span style="--x: 6%;  --d: 13s; --s: 1.1; --delay: -2s">🌸</span>
      <span style="--x: 14%; --d: 17s; --s: 0.8; --delay: -9s">🍃</span>
      <span style="--x: 23%; --d: 12s; --s: 1.3; --delay: -5s">🌷</span>
      <span style="--x: 33%; --d: 19s; --s: 0.9; --delay: -12s">🌸</span>
      <span style="--x: 42%; --d: 14s; --s: 1.0; --delay: -7s">🌼</span>
      <span style="--x: 51%; --d: 16s; --s: 1.4; --delay: -1s">🌸</span>
      <span style="--x: 60%; --d: 11s; --s: 0.8; --delay: -10s">🍃</span>
      <span style="--x: 69%; --d: 18s; --s: 1.2; --delay: -4s">🌺</span>
      <span style="--x: 77%; --d: 13s; --s: 1.0; --delay: -8s">🌸</span>
      <span style="--x: 85%; --d: 15s; --s: 1.3; --delay: -3s">🌻</span>
      <span style="--x: 92%; --d: 12s; --s: 0.9; --delay: -11s">🌸</span>
    </div>

    <main class="card">
      <h1>GestureBloom</h1>
      <p class="tagline">Grow flowers in the air with your hands</p>

      <ul class="guide">
        <li><span>☝️</span><b>Point</b><small>plant flowers</small></li>
        <li><span>✊</span><b>Fist</b><small>pause</small></li>
        <li><span>✋</span><b>Hold open</b><small>scatter them</small></li>
      </ul>

      <button id="startBtn">Start camera</button>
      <p id="status" class="status"></p>
      <p class="note">Your camera never leaves your browser.</p>
    </main>
  </div>

  <!-- Hidden video element: just the raw camera source -->
  <video id="video" playsinline muted></video>
  <!-- Everything you see is drawn on this canvas -->
  <canvas id="canvas"></canvas>

  <div id="toolbar" class="hidden">
    <button id="backdropBtn" type="button">🎨 Backdrop: Camera</button>
    <button id="petalsBtn" type="button">🌸 Petals: On</button>
    <button id="skeletonBtn" type="button">🖐 Skeleton: On</button>
    <button id="photoBtn" type="button">📸 Photo</button>
    <button id="recordBtn" type="button">⏺ Record</button>
  </div>

  <p id="privacy">🔒 Your camera never leaves your browser.</p>

  <script type="module" src="main.js"></script>
</body>
</html>
